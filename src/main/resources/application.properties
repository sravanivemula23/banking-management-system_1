spring.application.name=banking-management-system

# --- Database (values come from environment variables, never hard-code secrets) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# 'update' is fine for learning. Use Flyway/Liquibase + 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# JWT_SECRET must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Seed admin (created on first startup if it does not exist) ---
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@bank.local}
app.admin.password=${ADMIN_PASSWORD:}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Do not leak stack traces / internals in error responses
server.error.include-message=never
server.error.include-stacktrace=never
